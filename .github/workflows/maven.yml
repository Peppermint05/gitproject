# Workflow name
name: CI Pipeline

# This workflow runs anytime code is pushed to the main branch
on:
  push:
    branches: ["main"]

# Jobs to run in the workflow
jobs:
  compile:
    # The job will run on the latest Ubuntu GitHub runner
    runs-on: ubuntu-latest

    # Steps inside the job
    steps:
      # Checks out the repository code into the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # Builds the Java project using Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
