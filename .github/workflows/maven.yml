
#name
name: CICD Pipeline
#anytime something with main is detected, the push will be triggered
on:
  push:
    branches: [ "main" ]
#I removed pull request

#we have multiple job

jobs:
#job i want to include
compile:
#to run on
    runs-on: ubuntu-latest
#inside each job there will be multiple steps
    steps:
#uses refers to actions- on the runner it will create a local repo of the code to checkout the code
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

  
