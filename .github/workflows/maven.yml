# Workflow name
name: CI Pipeline

# This workflow runs anytime code is pushed to the main branch
on:
  push:
    branches: ["main"]

# Jobs to run in the workflow
jobs:
  compile:
    # The job will run on the latest Ubuntu GitHub runner
    runs-on: ubuntu-latest

    # Steps inside the job
    steps:
      # Checks out the repository code into the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # Builds the Java project using Maven
      - name: Build with Maven
        run: mvn compile
        
  security-check:      
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Trivy Installation
      run: |
        sudo apt-get install wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update -y
        sudo apt-get install trivy -y
        
    - name: Trivy Fs Scan
      run: trivy fs --format table -o fs-report.json .
      
    - name: gitleaks installation
      run: sudo apt install gitleaks -y

    - name: Gitleaks code scan
      run: gitleaks detect source . -r gitleaks-report.json -f json

